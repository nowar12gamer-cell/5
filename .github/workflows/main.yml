name: Windows-RDP
on:
  workflow_dispatch:

env:
  RDP_USER: runneradmin
  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || 'Oreoto52#2026!' }}

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP and set password
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Restart-Service -Name TermService -Force

          $user = $env:RDP_USER
          if ([string]::IsNullOrWhiteSpace($user)) { $user = 'runneradmin' }
          $pass = $env:RDP_PASSWORD
          if ([string]::IsNullOrWhiteSpace($pass)) { $pass = 'Oreoto52#2026!' }

          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-LocalUser -Name $user -Password $securePass -FullName $user -PasswordNeverExpires -ErrorAction Stop | Out-Null
          } else {
            Set-LocalUser -Name $user -Password $securePass -ErrorAction Stop
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "$user" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "$user" -ErrorAction SilentlyContinue
          Write-Host "User '$user' configured successfully."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" -Wait
          Start-Service -Name Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            Write-Error "TAILSCALE_AUTH_KEY secret is missing or empty."
            exit 1
          }
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            Write-Error "Tailscale executable not found after installation."
            exit 1
          }
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-rdp-$env:GITHUB_RUN_ID" --unattended
          if ($LASTEXITCODE -ne 0) { Write-Error "tailscale up failed"; exit 1 }

          $ip = $null
          for ($i = 0; $i -lt 15 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1).Trim()
            if (-not $ip) { Start-Sleep -Seconds 4 }
          }
          if (-not $ip) { Write-Error "No Tailscale IP assigned"; exit 1 }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Show connection info
        shell: pwsh
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: the one in RDP_PASSWORD (or Oreoto52#2026!)"
          Write-Host "=================="

      - name: Keep alive
        shell: pwsh
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP active - IP: $env:TAILSCALE_IP"
              Start-Sleep -Seconds 300
          }
