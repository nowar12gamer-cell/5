name: Linux-Remote
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install desktop and VNC
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-terminal tigervnc-standalone-server dbus-x11 firefox

      - name: Start VNC server
        run: |
          mkdir -p ~/.vnc
          echo "Vx7kP2mQ" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          cat > ~/.vnc/xstartup <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup
          vncserver :1 -geometry 1600x900 -depth 24 -localhost no

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing"; exit 1
          fi
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gh-linux-$GITHUB_RUN_ID"
          for i in $(seq 1 15); do
            IP=$(tailscale ip -4 2>/dev/null | head -n1)
            [ -n "$IP" ] && break
            sleep 4
          done
          [ -z "$IP" ] && { echo "No Tailscale IP"; exit 1; }
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"

      - name: Show connection info
        run: |
          echo "=== LINUX ACCESS ==="
          echo "Address:      $TAILSCALE_IP:5901"
          echo "VNC Password: Vx7kP2mQ"
          echo "===================="

      - name: Keep alive
        run: |
          while true;
