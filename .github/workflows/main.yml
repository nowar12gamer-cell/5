name: Windows-Remote
on:
  workflow_dispatch:

env:
  RDP_USER: Abdullah
  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || 'Oreoto52#cat!' }}

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: Enable RDP and create user Abdullah
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $existingUser = Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue
          if (-not $existingUser) {
            New-LocalUser -Name $env:RDP_USER -Password $securePass -FullName "Abdullah" -PasswordNeverExpires -AccountNeverExpires
          } else {
            Set-LocalUser -Name $env:RDP_USER -Password $securePass
          }
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER -ErrorAction SilentlyContinue

      - name: Customize look (animated rainbow wallpaper, cursors, icons)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing

          $w = 1920
          $h = 1080
          $wall = Join-Path $env:PUBLIC 'wall.jpg'
          $text = 'Abdullah, Roblox programmer'

          $sig = '[DllImport("user32.dll", CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(int a, int b, string c, int d);'
          $native = Add-Type -MemberDefinition $sig -Name Native -Namespace Win32 -PassThru

          function Save-RainbowWallpaper {
            param([float]$Shift)

            $bmp = [System.Drawing.Bitmap]::new($w, $h)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = 'AntiAlias'
            $g.TextRenderingHint = 'AntiAlias'

            $rect = [System.Drawing.Rectangle]::new(0, 0, $w, $h)
            $c1 = [System.Drawing.Color]::FromArgb(20, 8, 40)
            $c2 = [System.Drawing.Color]::FromArgb(110, 40, 180)
            $brush = [System.Drawing.Drawing2D.LinearGradientBrush]::new($rect, $c1, $c2, 45.0)
            $g.FillRectangle($brush, $rect)

            $font = [System.Drawing.Font]::new('Segoe UI', 84, ([System.Drawing.FontStyle]::Bold))
            $sf = [System.Drawing.StringFormat]::new()
            $sf.Alignment = 'Center'
            $sf.LineAlignment = 'Center'
            $box = [System.Drawing.RectangleF]::new(0, 0, $w, $h)
            $measured = $g.MeasureString($text, $font, $box.Size, $sf)

            $textRect = [System.Drawing.RectangleF]::new(
              (($w - $measured.Width) / 2),
              (($h - $measured.Height) / 2),
              ([Math]::Max($measured.Width, 10.0)),
              ([Math]::Max($measured.Height, 10.0))
            )

            $p1 = [System.Drawing.PointF]::new($textRect.Left, $textRect.Top)
            $p2 = [System.Drawing.PointF]::new([Math]::Max($textRect.Right, $textRect.Left + 10.0), $textRect.Top)
            $rainbowBrush = [System.Drawing.Drawing2D.LinearGradientBrush]::new(
              $p1,
              $p2,
              [System.Drawing.Color]::Red,
              [System.Drawing.Color]::Violet
            )

            $baseColors = [System.Drawing.Color[]]@(
              [System.Drawing.Color]::FromArgb(255, 255, 50, 50),
              [System.Drawing.Color]::FromArgb(255, 255, 140, 0),
              [System.Drawing.Color]::FromArgb(255, 255, 230, 0),
              [System.Drawing.Color]::FromArgb(255, 50, 220, 100),
              [System.Drawing.Color]::FromArgb(255, 40, 180, 255),
              [System.Drawing.Color]::FromArgb(255, 120, 90, 255),
              [System.Drawing.Color]::FromArgb(255, 230, 80, 255)
            )
            $basePos = [single[]]@(0.0, 0.17, 0.34, 0.51, 0.68, 0.85, 1.0)
            $shiftedPos = New-Object 'single[]' 7
            for ($k = 0; $k -lt 7; $k++) {
              $val = ($basePos[$k] + $Shift) % 1.0
              if ($val -lt 0) { $val += 1.0 }
              $shiftedPos[$k] = [single]$val
            }

            $pairs = for ($k = 0; $k -lt 7; $k++) {
              [PSCustomObject]@{ Pos = $shiftedPos[$k]; Col = $baseColors[$k] }
            }
            $sorted = $pairs | Sort-Object Pos
            $blend = [System.Drawing.Drawing2D.ColorBlend]::new(9)
            $cols = New-Object 'System.Drawing.Color[]' 9
            $poss = New-Object 'single[]' 9

            $cols[0] = ($sorted[-1]).Col
            $poss[0] = [single]0.0
            for ($k = 0; $k -lt 7; $k++) {
              $cols[$k + 1] = $sorted[$k].Col
              $poss[$k + 1] = [single][Math]::Min([Math]::Max($sorted[$k].Pos, 0.001), 0.999)
            }
            $cols[8] = ($sorted[0]).Col
            $poss[8] = [single]1.0

            $blend.Colors = $cols
            $blend.Positions = $poss
            $rainbowBrush.InterpolationColors = $blend

            $shadowBrush = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(140, 10, 5, 20))
            $shadowBox = [System.Drawing.RectangleF]::new(0, 4, $w, $h)
            $g.DrawString($text, $font, $shadowBrush, $shadowBox, $sf)
            $g.DrawString($text, $font, $rainbowBrush, $box, $sf)

            $bmp.Save($wall, [System.Drawing.Imaging.ImageFormat]::Jpeg)

            $rainbowBrush.Dispose()
            $shadowBrush.Dispose()
            $brush.Dispose()
            $font.Dispose()
            $g.Dispose()
            $bmp.Dispose()
          }

          Save-RainbowWallpaper -Shift 0.0

          function Convert-PngToCur {
            param(
              [byte[]]$PngBytes,
              [string]$OutPath,
              [int]$Size,
              [uint16]$HotspotX,
              [uint16]$HotspotY
            )
            $fs = [System.IO.File]::Open($OutPath, [System.IO.FileMode]::Create)
            $bw = [System.IO.BinaryWriter]::new($fs)
            $bw.Write([uint16]0)
            $bw.Write([uint16]2)
            $bw.Write([uint16]1)
            $bw.Write([byte]($Size -band 0xFF))
            $bw.Write([byte]($Size -band 0xFF))
            $bw.Write([byte]0)
            $bw.Write([byte]0)
            $bw.Write($HotspotX)
            $bw.Write($HotspotY)
            $bw.Write([uint32]$PngBytes.Length)
            $bw.Write([uint32]22)
            $bw.Write($PngBytes)
            $bw.Close()
            $fs.Close()
          }

          # ---- 1. Kokushibo Katana Primary Cursor (.cur) ----
          $katanaB64 = 'iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAANSURBVFhhe7XBCQAAAMQwsP+N3q2EAgAAwK8B8XQB+X0+XQAAAABJRU5ErkJggg=='
          $katanaPng = Join-Path $env:TEMP 'kokushibo_raw.png'
          [System.IO.File]::WriteAllBytes($katanaPng, [System.Convert]::FromBase64String($katanaB64))

          $curSize = 64
          $srcImg = [System.Drawing.Image]::FromFile($katanaPng)
          $kbmp = [System.Drawing.Bitmap]::new($curSize, $curSize, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
          $kg = [System.Drawing.Graphics]::FromImage($kbmp)
          $kg.SmoothingMode = 'HighQuality'
          $kg.InterpolationMode = 'HighQualityBicubic'
          $kg.Clear([System.Drawing.Color]::Transparent)
          $kg.DrawImage($srcImg, 0, 0, $curSize, $curSize)
          $kg.Dispose()
          $srcImg.Dispose()

          for ($y = 0; $y -lt $curSize; $y++) {
            for ($x = 0; $x -lt $curSize; $x++) {
              $px = $kbmp.GetPixel($x, $y)
              if ($px.R -lt 16 -and $px.G -lt 16 -and $px.B -lt 18) {
                $kbmp.SetPixel($x, $y, [System.Drawing.Color]::FromArgb(0, 0, 0, 0))
              }
            }
          }

          $kms = [System.IO.MemoryStream]::new()
          $kbmp.Save($kms, [System.Drawing.Imaging.ImageFormat]::Png)
          $katanaCurBytes = $kms.ToArray()
          $kms.Dispose()
          $kbmp.Dispose()

          $katanaCurPath = Join-Path $env:PUBLIC 'kokushibo_arrow.cur'
          Convert-PngToCur -PngBytes $katanaCurBytes -OutPath $katanaCurPath -Size $curSize -HotspotX 6 -HotspotY 6

          # ---- 2. Yellow-Halo Cursor (.cur) for Hand / AppStarting ----
          $size = 64
          $cbmp = [System.Drawing.Bitmap]::new($size, $size, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
          $cg = [System.Drawing.Graphics]::FromImage($cbmp)
          $cg.SmoothingMode = 'AntiAlias'
          $cg.Clear([System.Drawing.Color]::Transparent)

          $haloFill = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(115, 255, 225, 0))
          $haloPen  = [System.Drawing.Pen]::new([System.Drawing.Color]::FromArgb(230, 255, 200, 0), 3)
          $cg.FillEllipse($haloFill, 4, 4, 44, 44)
          $cg.DrawEllipse($haloPen, 4, 4, 44, 44)

          $pts = [System.Drawing.Point[]]@(
            ([System.Drawing.Point]::new(26, 26)),
            ([System.Drawing.Point]::new(26, 56)),
            ([System.Drawing.Point]::new(34, 48)),
            ([System.Drawing.Point]::new(40, 60)),
            ([System.Drawing.Point]::new(45, 57)),
            ([System.Drawing.Point]::new(39, 45)),
            ([System.Drawing.Point]::new(49, 45))
          )
          $arrowBrush = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::Black)
          $arrowPen   = [System.Drawing.Pen]::new([System.Drawing.Color]::White, 2)
          $cg.FillPolygon($arrowBrush, $pts)
          $cg.DrawPolygon($arrowPen, $pts)
          $cg.Dispose()

          $ms = [System.IO.MemoryStream]::new()
          $cbmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
          $pngBytes = $ms.ToArray()
          $ms.Dispose()
          $cbmp.Dispose()

          $curPath = Join-Path $env:PUBLIC 'yellow_halo.cur'
          Convert-PngToCur -PngBytes $pngBytes -OutPath $curPath -Size $size -HotspotX 26 -HotspotY 26

          reg load HKU\DefaultUser "C:\Users\Default\NTUSER.DAT" | Out-Null

          $targets = @('HKCU:', 'Registry::HKEY_USERS\DefaultUser')
          foreach ($root in $targets) {
            $desk = "$root\Control Panel\Desktop"
            New-Item -Path $desk -Force | Out-Null
            Set-ItemProperty -Path $desk -Name Wallpaper -Value $wall
            Set-ItemProperty -Path $desk -Name WallpaperStyle -Value '10'
            Set-ItemProperty -Path $desk -Name TileWallpaper -Value '0'

            $theme = "$root\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
            New-Item -Path $theme -Force | Out-Null
            Set-ItemProperty -Path $theme -Name AppsUseLightTheme -Value 0 -Type DWord
            Set-ItemProperty -Path $theme -Name SystemUsesLightTheme -Value 0 -Type DWord

            $cursorsKey = "$root\Control Panel\Cursors"
            New-Item -Path $cursorsKey -Force | Out-Null
            Set-ItemProperty -Path $cursorsKey -Name 'Arrow'       -Value $katanaCurPath
            Set-ItemProperty -Path $cursorsKey -Name 'Hand'        -Value $curPath
            Set-ItemProperty -Path $cursorsKey -Name 'AppStarting' -Value $curPath
            Set-ItemProperty -Path $cursorsKey -Name 'UpArrow'     -Value $curPath

            $hide = "$root\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel"
            New-Item -Path $hide -Force | Out-Null
            $ids = '{20D04FE0-3AEA-1069-A2D8-08002B30309D}', '{645FF040-5081-101B-9F08-00AA002F954E}', '{59031a47-3f72-44a7-89c5-5595fe6b30ee}', '{F02C1A0D-BE21-4350-88B0-7367FC96EF3C}', '{5399E694-6CE5-4D6D-8DFE-79F4C8FFEB2C}'
            foreach ($id in $ids) {
              Set-ItemProperty -Path $hide -Name $id -Value 0 -Type DWord
            }
            $bag = "$root\Software\Microsoft\Windows\Shell\Bags\1\Desktop"
            New-Item -Path $bag -Force | Out-Null
            Set-ItemProperty -Path $bag -Name IconSize -Value 48 -Type DWord
          }

          [GC]::Collect()
          reg unload HKU\DefaultUser | Out-Null

          $native::SystemParametersInfo(20, 0, $wall, 3) | Out-Null
          $native::SystemParametersInfo(0x0057, 0, $null, 3) | Out-Null

          Write-Host "Customization with Kokushibo Katana arrow applied."

      - name: Install Roblox Studio
        shell: pwsh
        run: |
          $installed = $false
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install --id Roblox.RobloxStudio --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -eq 0) { $installed = $true }
          }
          if (-not $installed) {
            $studioInstaller = "$env:TEMP\RobloxStudioInstaller.exe"
            Invoke-WebRequest -Uri "https://setup.rbxcdn.com/RobloxStudioInstaller.exe" -OutFile $studioInstaller -UseBasicParsing
            Start-Process -FilePath $studioInstaller -ArgumentList "/silent" -Wait
          }
          Start-Sleep -Seconds 5
          Write-Host "Roblox Studio installation step finished."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" -Wait
          Start-Service -Name Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            Write-Error "TAILSCALE_AUTH_KEY secret is missing."
            exit 1
          }
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-win-$env:GITHUB_RUN_ID" --unattended
          if ($LASTEXITCODE -ne 0) { Write-Error "tailscale up failed"; exit 1 }
          $ip = $null
          for ($i = 0; $i -lt 15 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep -Seconds 4 }
          }
          if (-not $ip) { Write-Error "No Tailscale IP"; exit 1 }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Show connection info
        shell: pwsh
        run: |
          Write-Host "=== WINDOWS ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "======================"

      - name: Keep alive & animate rainbow
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $sig = '[DllImport("user32.dll", CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(int a, int b, string c, int d);'
          $native = Add-Type -MemberDefinition $sig -Name NativeAnim -Namespace Win32 -PassThru
          $wall = Join-Path $env:PUBLIC 'wall.jpg'
          $w = 1920
          $h = 1080
          $text = 'Abdullah, Roblox programmer'
          $baseColors = [System.Drawing.Color[]]@(
            [System.Drawing.Color]::FromArgb(255, 255, 50, 50),
            [System.Drawing.Color]::FromArgb(255, 255, 140, 0),
            [System.Drawing.Color]::FromArgb(255, 255, 230, 0),
            [System.Drawing.Color]::FromArgb(255, 50, 220, 100),
            [System.Drawing.Color]::FromArgb(255, 40, 180, 255),
            [System.Drawing.Color]::FromArgb(255, 120, 90, 255),
            [System.Drawing.Color]::FromArgb(255, 230, 80, 255)
          )
          $basePos = [single[]]@(0.0, 0.17, 0.34, 0.51, 0.68, 0.85, 1.0)

          $steps = 4020
          for ($s = 1; $s -le $steps; $s++) {
            Start-Sleep -Seconds 5
            $shift = ($s * 0.025) % 1.0

            $bmp = [System.Drawing.Bitmap]::new($w, $h)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = 'AntiAlias'
            $g.TextRenderingHint = 'AntiAlias'

            $rect = [System.Drawing.Rectangle]::new(0, 0, $w, $h)
            $c1 = [System.Drawing.Color]::FromArgb(20, 8, 40)
            $c2 = [System.Drawing.Color]::FromArgb(110, 40, 180)
            $brush = [System.Drawing.Drawing2D.LinearGradientBrush]::new($rect, $c1, $c2, 45.0)
            $g.FillRectangle($brush, $rect)

            $font = [System.Drawing.Font]::new('Segoe UI', 84, ([System.Drawing.FontStyle]::Bold))
            $sf = [System.Drawing.StringFormat]::new()
            $sf.Alignment = 'Center'
            $sf.LineAlignment = 'Center'
            $box = [System.Drawing.RectangleF]::new(0, 0, $w, $h)
            $measured = $g.MeasureString($text, $font, $box.Size, $sf)

            $textRect = [System.Drawing.RectangleF]::new(
              (($w - $measured.Width) / 2),
              (($h - $measured.Height) / 2),
              ([Math]::Max($measured.Width, 10.0)),
              ([Math]::Max($measured.Height, 10.0))
            )

            $p1 = [System.Drawing.PointF]::new($textRect.Left, $textRect.Top)
            $p2 = [System.Drawing.PointF]::new([Math]::Max($textRect.Right, $textRect.Left + 10.0), $textRect.Top)
            $rainbowBrush = [System.Drawing.Drawing2D.LinearGradientBrush]::new(
              $p1,
              $p2,
              [System.Drawing.Color]::Red,
              [System.Drawing.Color]::Violet
            )

            $pairs = for ($k = 0; $k -lt 7; $k++) {
              $val = ($basePos[$k] + $shift) % 1.0
              [PSCustomObject]@{ Pos = [single]$val; Col = $baseColors[$k] }
            }
            $sorted = $pairs | Sort-Object Pos
            $blend = [System.Drawing.Drawing2D.ColorBlend]::new(9)
            $cols = New-Object 'System.Drawing.Color[]' 9
            $poss = New-Object 'single[]' 9
            $cols[0] = ($sorted[-1]).Col
            $poss[0] = [single]0.0
            for ($k = 0; $k -lt 7; $k++) {
              $cols[$k + 1] = $sorted[$k].Col
              $poss[$k + 1] = [single][Math]::Min([Math]::Max($sorted[$k].Pos, 0.001), 0.999)
            }
            $cols[8] = ($sorted[0]).Col
            $poss[8] = [single]1.0
            $blend.Colors = $cols
            $blend.Positions = $poss
            $rainbowBrush.InterpolationColors = $blend

            $shadowBrush = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(140, 10, 5, 20))
            $shadowBox = [System.Drawing.RectangleF]::new(0, 4, $w, $h)
            $g.DrawString($text, $font, $shadowBrush, $shadowBox, $sf)
            $g.DrawString($text, $font, $rainbowBrush, $box, $sf)

            $bmp.Save($wall, [System.Drawing.Imaging.ImageFormat]::Jpeg)

            $rainbowBrush.Dispose()
            $shadowBrush.Dispose()
            $brush.Dispose()
            $font.Dispose()
            $g.Dispose()
            $bmp.Dispose()

            $native::SystemParametersInfo(20, 0, $wall, 3) | Out-Null
          }
