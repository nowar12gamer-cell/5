name: Windows-RDP
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  RDP_USER: runneradmin
  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || 'Oreoto52#2026!' }}
  WALLPAPER_MP4_URL: "https://YOUR_DIRECT_LINK_TO/yuta-okkotsu-and-rika-2-live-wallpaper.mp4"

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Setup RDP, Cursors, Wallpaper & Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Start-Service -Name TermService -ErrorAction SilentlyContinue; Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          $u = if ([string]::IsNullOrWhiteSpace($env:RDP_USER)) { 'runneradmin' } else { $env:RDP_USER }
          $p = if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { 'Oreoto52#2026!' } else { $env:RDP_PASSWORD }
          $sp = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) { New-LocalUser -Name $u -Password $sp -FullName $u -PasswordNeverExpires -ErrorAction SilentlyContinue | Out-Null } else { Set-LocalUser -Name $u -Password $sp -ErrorAction SilentlyContinue }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue; Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Drawing; $d = "C:\CustomTheme"; New-Item -ItemType Directory -Path $d -Force | Out-Null
          function Save-Cur([string]$inPng, [string]$outCur, [int]$hx, [int]$hy) {
            if (-not (Test-Path $inPng)) { return }; $b = [System.Drawing.Bitmap]::FromFile($inPng)
            try {
              $r = New-Object System.Drawing.Bitmap(48, 48, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb); $g = [System.Drawing.Graphics]::FromImage($r)
              $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic; $g.Clear([System.Drawing.Color]::Transparent); $g.DrawImage($b, 0, 0, 48, 48); $g.Dispose()
              for ($y=0; $y -lt 48; $y++) { for ($x=0; $x -lt 48; $x++) { $px = $r.GetPixel($x, $y); if ($px.R -lt 12 -and $px.G -lt 12 -and $px.B -lt 12) { $r.SetPixel($x, $y, [System.Drawing.Color]::FromArgb(0, $px.R, $px.G, $px.B)) } } }
              $ms = New-Object System.IO.MemoryStream; $r.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png); $png = $ms.ToArray(); $ms.Dispose(); $r.Dispose()
              $fs = [System.IO.File]::Open($outCur, [System.IO.FileMode]::Create); $bw = New-Object System.IO.BinaryWriter($fs)
              $bw.Write([UInt16]0); $bw.Write([UInt16]2); $bw.Write([UInt16]1); $bw.Write([Byte]48); $bw.Write([Byte]48); $bw.Write([Byte]0); $bw.Write([Byte]0); $bw.Write([UInt16]$hx); $bw.Write([UInt16]$hy); $bw.Write([UInt32]$png.Length); $bw.Write([UInt32]22); $bw.Write($png); $bw.Flush(); $bw.Close(); $fs.Close()
            } finally { $b.Dispose() }
          }
          $f1 = "Demon Slayer Kokushibo Katana Animated Cursor--pointer--SweezyCursors.cur.ico.png"; $f2 = "Demon Slayer Water Breathing Sword Animated Cursor--pointer--SweezyCursors.cur.ico.png"
          Save-Cur $f1 "$d\normal.cur" 6 6; Save-Cur $f2 "$d\link.cur" 12 8
          if (Test-Path "$d\normal.cur") { Set-ItemProperty -Path 'HKCU:\Control Panel\Cursors' -Name "Arrow" -Value "$d\normal.cur" -Force -ErrorAction SilentlyContinue }
          if (Test-Path "$d\link.cur") { Set-ItemProperty -Path 'HKCU:\Control Panel\Cursors' -Name "Hand" -Value "$d\link.cur" -Force -ErrorAction SilentlyContinue }
          if (-not [string]::IsNullOrWhiteSpace($env:WALLPAPER_MP4_URL) -and ($env:WALLPAPER_MP4_URL -notlike "*YOUR_DIRECT_LINK_TO*")) { try { Invoke-WebRequest -Uri $env:WALLPAPER_MP4_URL -OutFile "$d\wallpaper.mp4" -UseBasicParsing -ErrorAction Stop } catch {} }
          try { Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;public class Win32Theme{[DllImport("user32.dll",SetLastError=true)]public static extern bool SystemParametersInfo(uint a,uint b,string c,uint d);}' -ErrorAction SilentlyContinue; [Win32Theme]::SystemParametersInfo(0x0057,0,$null,0x03) | Out-Null } catch {}
          $msi = "$env:TEMP\ts.msi"; try { Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi -UseBasicParsing; Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait; Start-Service -Name Tailscale -ErrorAction SilentlyContinue; Start-Sleep -Seconds 5 } catch {}
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not [string]::IsNullOrWhiteSpace($env:TS_AUTHKEY) -and (Test-Path $ts)) { & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-rdp-$env:GITHUB_RUN_ID" --unattended --accept-routes 2>$null | Out-Null }
          $ip = "N/A"; for ($i=0; $i -lt 15; $i++) { if (Test-Path $ts) { $cand = (& $ts ip -4 2>$null | Select-Object -First 1).Trim(); if ($cand) { $ip = $cand; break } }; Start-Sleep -Seconds 4 }
          Write-Host "=== RDP: $ip | User: $u | Pass: $p ==="
          while ($true) { Write-Host "[$(Get-Date)] Active - IP: $ip"; Start-Sleep -Seconds 300 }
