name: macOS-VNC
on:
  workflow_dispatch:

jobs:
  mac-vnc:
    runs-on: macos-latest
    timeout-minutes: 360   # الحد الأقصى في GitHub هو 6 ساعات
    steps:
      - name: Set user password
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # كلمة سر VNC لازم تكون 8 حروف أو أقل
          sudo dscl . -passwd /Users/runner "$VNC_PASSWORD"

      - name: Enable Screen Sharing (VNC)
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent -privs -all

      - name: Install Tailscale
        run: |
          brew install tailscale
          sudo brew services start tailscale
          sleep 5

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gh-mac-$GITHUB_RUN_ID"
          for i in $(seq 1 10); do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            [ -n "$TS_IP" ] && break
            sleep 5
          done
          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned"; exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Show connection info
        run: |
          echo "=== VNC ACCESS ==="
          echo "Address:  $TAILSCALE_IP  (port 5900)"
          echo "Username: runner"
          echo "Password: the VNC_PASSWORD secret"
          echo "=================="

      - name: Keep alive
        run: |
          while true; do
            echo "[$(date)] VNC active"
            sleep 300
          done
