name: Windows-RDP
on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  RDP_USER: runneradmin
  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || 'Oreoto52#2026!' }}
  WALLPAPER_MP4_URL: "https://YOUR_DIRECT_LINK_TO/yuta-okkotsu-and-rika-2-live-wallpaper.mp4"

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable RDP and set password
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Restart-Service -Name TermService -Force

          $user = $env:RDP_USER
          if ([string]::IsNullOrWhiteSpace($user)) { $user = 'runneradmin' }
          $pass = $env:RDP_PASSWORD
          if ([string]::IsNullOrWhiteSpace($pass)) { $pass = 'Oreoto52#2026!' }

          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-LocalUser -Name $user -Password $securePass -FullName $user -PasswordNeverExpires -ErrorAction Stop | Out-Null
          } else {
            Set-LocalUser -Name $user -Password $securePass -ErrorAction Stop
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "$user" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "$user" -ErrorAction SilentlyContinue
          Write-Host "User '$user' configured successfully."

      - name: Apply custom cursors and wallpaper
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $customDir = "C:\CustomTheme"
          New-Item -ItemType Directory -Path $customDir -Force | Out-Null

          function Convert-ImageToCur {
            param(
              [string]$InputPath,
              [string]$OutputCurPath,
              [int]$Size = 48,
              [int]$HotspotX = 4,
              [int]$HotspotY = 4
            )
            if (-not (Test-Path $InputPath)) {
              Write-Warning "Image not found: $InputPath"
              return
            }
            $srcBmp = [System.Drawing.Bitmap]::FromFile($InputPath)
            try {
              $resized = New-Object System.Drawing.Bitmap($Size, $Size, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              $g = [System.Drawing.Graphics]::FromImage($resized)
              $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              $g.Clear([System.Drawing.Color]::Transparent)
              $g.DrawImage($srcBmp, 0, 0, $Size, $Size)
              $g.Dispose()

              for ($y = 0; $y -lt $resized.Height; $y++) {
                for ($x = 0; $x -lt $resized.Width; $x++) {
                  $px = $resized.GetPixel($x, $y)
                  if ($px.R -lt 12 -and $px.G -lt 12 -and $px.B -lt 12) {
                    $resized.SetPixel($x, $y, [System.Drawing.Color]::FromArgb(0, $px.R, $px.G, $px.B))
                  }
                }
              }

              $msPng = New-Object System.IO.MemoryStream
              $resized.Save($msPng, [System.Drawing.Imaging.ImageFormat]::Png)
              $pngBytes = $msPng.ToArray()
              $msPng.Dispose()
              $resized.Dispose()

              $fs = [System.IO.File]::Open($OutputCurPath, [System.IO.FileMode]::Create)
              $bw = New-Object System.IO.BinaryWriter($fs)
              $bw.Write([UInt16]0)
              $bw.Write([UInt16]2)
              $bw.Write([UInt16]1)
              $bw.Write([Byte]($Size % 256))
              $bw.Write([Byte]($Size % 256))
              $bw.Write([Byte]0)
              $bw.Write([Byte]0)
              $bw.Write([UInt16]$HotspotX)
              $bw.Write([UInt16]$HotspotY)
              $bw.Write([UInt32]$pngBytes.Length)
              $bw.Write([UInt32]22)
              $bw.Write($pngBytes)
              $bw.Flush()
              $bw.Close()
              $fs.Close()
            } finally {
              $srcBmp.Dispose()
            }
          }

          $arrowPng = "$customDir\normal.png"
          $handPng  = "$customDir\link.png"
          $arrowCur = "$customDir\normal.cur"
          $handCur  = "$customDir\link.cur"

          $kokushiboFile = "Demon Slayer Kokushibo Katana Animated Cursor--pointer--SweezyCursors.cur.ico.png"
          $waterSwordFile = "Demon Slayer Water Breathing Sword Animated Cursor--pointer--SweezyCursors.cur.ico.png"

          if (Test-Path $kokushiboFile) {
            Copy-Item $kokushiboFile $arrowPng -Force
            Convert-ImageToCur -InputPath $arrowPng -OutputCurPath $arrowCur -Size 48 -HotspotX 6 -HotspotY 6
          } else {
            Write-Warning "Missing file in repo: $kokushiboFile"
          }

          if (Test-Path $waterSwordFile) {
            Copy-Item $waterSwordFile $handPng -Force
            Convert-ImageToCur -InputPath $handPng -OutputCurPath $handCur -Size 48 -HotspotX 12 -HotspotY 8
          } else {
            Write-Warning "Missing file in repo: $waterSwordFile"
          }

          $cursorReg = "HKCU:\Control Panel\Cursors"
          if (Test-Path $arrowCur) {
            Set-ItemProperty -Path $cursorReg -Name "Arrow" -Value $arrowCur -Force
          }
          if (Test-Path $handCur) {
            Set-ItemProperty -Path $cursorReg -Name "Hand" -Value $handCur -Force
          }

          $mp4Path = "$customDir\yuta-okkotsu-and-rika-2-live-wallpaper.mp4"
          if (-not [string]::IsNullOrWhiteSpace($env:WALLPAPER_MP4_URL) -and ($env:WALLPAPER_MP4_URL -notlike "*YOUR_DIRECT_LINK_TO*")) {
            try {
              Invoke-WebRequest -Uri $env:WALLPAPER_MP4_URL -OutFile $mp4Path -UseBasicParsing
              Write-Host "Wallpaper video downloaded to $mp4Path"
            } catch {
              Write-Warning "Could not download wallpaper video: $_"
            }
          }

          $csCode = @'
using System;
using System.Runtime.InteropServices;

public class Win32Theme {
  [DllImport("user32.dll", SetLastError = true)]
  public static extern bool SystemParametersInfo(uint uiAction, uint uiParam, string pvParam, uint fWinIni);
}
'@
          Add-Type -TypeDefinition $csCode
          [Win32Theme]::SystemParametersInfo(0x0057, 0, $null, 0x03) | Out-Null
          Write-Host "Custom cursors applied."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" -Wait
          Start-Service -Name Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            Write-Warning "TAILSCALE_AUTH_KEY secret is missing or empty. Skipping Tailscale login."
            exit 0
          }
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            Write-Warning "Tailscale executable not found after installation."
            exit 0
          }
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-rdp-$env:GITHUB_RUN_ID" --unattended
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "tailscale up failed with exit code $LASTEXITCODE"
            exit 0
          }

          $ip = $null
          for ($i = 0; $i -lt 15 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1).Trim()
            if (-not $ip) { Start-Sleep -Seconds 4 }
          }
          if (-not $ip) {
            Write-Warning "No Tailscale IP assigned"
            exit 0
          }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Show connection info
        shell: pwsh
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: the one in RDP_PASSWORD (or Oreoto52#2026!)"
          Write-Host "=================="

      - name: Keep alive
        shell: pwsh
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP active - IP: $env:TAILSCALE_IP"
              Start-Sleep -Seconds 300
          }
