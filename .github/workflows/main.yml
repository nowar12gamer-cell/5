name: macOS-Remote
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Set user password
        env:
          MAC_PASSWORD: ${{ secrets.MAC_PASSWORD || 'Vx7kP2mQ' }}
        run: |
          if [ -z "$MAC_PASSWORD" ]; then
            echo "MAC_PASSWORD secret is missing"; exit 1
          fi
          sudo dscl . -passwd /Users/runner "$MAC_PASSWORD"
          echo "Password set for user: runner"

      - name: Enable Screen Sharing (VNC)
        env:
          MAC_PASSWORD: ${{ secrets.MAC_PASSWORD || 'Vx7kP2mQ' }}
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$MAC_PASSWORD" \
            -restart -agent -privs -all

      - name: Install and start Tailscale
        run: |
          brew install tailscale
          sudo brew services start tailscale
          sleep 5

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing"; exit 1
          fi
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gh-mac-$GITHUB_RUN_ID"
          for i in $(seq 1 15); do
            IP=$(tailscale ip -4 2>/dev/null | head -n1)
            [ -n "$IP" ] && break
            sleep 4
          done
          [ -z "$IP" ] && { echo "No Tailscale IP"; exit 1; }
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"

      - name: Show connection info
        run: |
          echo "=== MAC ACCESS ==="
          echo "Address:  vnc://$TAILSCALE_IP"
          echo "Username: runner"
          echo "Password: Vx7kP2mQ"
          echo "=================="

      - name: Keep alive
        run: |
          while true; do
            echo "[$(date)] Mac active - IP: $TAILSCALE_IP"
            sleep 300
          done
