name: Windows 11 VM

on:
  workflow_dispatch:

jobs:
  windows-11:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check virtualization support
        shell: bash
        run: |
          echo "Checking host virtualization support..."
          if [ -e /dev/kvm ]; then
            echo "KVM is available."
          else
            echo "KVM is not available on this runner."
            exit 1
          fi

      - name: Install virtualization tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm qemu-utils

      - name: Show QEMU version
        shell: bash
        run: |
          qemu-system-x86_64 --version

      - name: Prepare VM directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/windows11"

      - name: Create Windows 11 disk
        shell: bash
        run: |
          qemu-img create -f qcow2 "$RUNNER_TEMP/windows11/windows11.qcow2" 64G

      - name: VM information
        shell: bash
        run: |
          echo "Windows 11 VM disk created."
          echo "A licensed Windows 11 installation ISO is required."
          echo "Place/provide your own Windows 11 ISO through an appropriate private artifact or storage workflow."
          echo "This workflow does not download or redistribute Windows."

      - name: Start VM placeholder
        shell: bash
        run: |
          echo "VM storage is ready."
          echo "To boot Windows 11, attach your own Windows 11 ISO and configure the required UEFI/TPM/Secure Boot devices."
          echo "The GitHub-hosted runner will be removed when the job ends."
